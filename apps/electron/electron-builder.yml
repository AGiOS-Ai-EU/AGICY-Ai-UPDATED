appId: ai.agicy.updated
productName: UPDATED
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: "resources/bin/${platform}-${arch}"
    to: "bin"
    filter:
      - "**/*"
  - from: "resources/whisper/${platform}-${arch}"
    to: "whisper/${platform}-${arch}"
    filter:
      - "**/*"
win:
  executableName: UPDATED
  icon: icon.ico
  # When CSC_LINK / WIN_CSC_LINK + CSC_KEY_PASSWORD are set in CI, electron-builder signs the installer.
  signAndEditExecutable: true
  target:
    - nsis
    - msi
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
msi:
  artifactName: ${productName}-${version}.${ext}
mac:
  identity: null
  icon: icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSAppleEventsUsageDescription: UPDATED uses Apple Events to paste transcribed text into the focused application.
  # CI sets APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID and runs with -c.mac.notarize=true
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  executableName: updated
  icon: icons
  desktop:
    entry:
      StartupWMClass: updated
  target:
    - AppImage
    - deb
  maintainer: AGICY.Ai
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: AGiOS-Ai-EU
  repo: UPDATED
