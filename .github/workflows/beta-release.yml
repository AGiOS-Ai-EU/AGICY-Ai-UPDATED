name: Publish desktop beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from apps/electron/package.json
        required: true
        default: 0.9.0-beta.6

permissions:
  contents: write

concurrency:
  group: updated-beta-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      windows_signing: ${{ steps.windows_signing.outputs.enabled }}
      macos_signing: ${{ steps.macos_signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./apps/electron/package.json').version")"
          if [[ "${{ inputs.version }}" != "$expected" ]]; then
            echo "Requested version '${{ inputs.version }}' does not match package version '$expected'." >&2
            exit 1
          fi
          echo "value=$expected" >> "$GITHUB_OUTPUT"
      - id: windows_signing
        shell: bash
        run: |
          if [[ -n "${{ secrets.WINDOWS_CERT_BASE64 }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - id: macos_signing
        shell: bash
        run: |
          if [[ -n "${{ secrets.APPLE_CERT_BASE64 }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@freestyle-voice/server
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxext-dev libglib2.0-dev cmake libx11-xcb-dev binutils
      - name: Build Linux installers
        working-directory: apps/electron
        run: pnpm run build:linux
      - name: Verify packaged native binaries
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: updated-linux-${{ needs.validate.outputs.version }}
          path: |
            apps/electron/dist/*.AppImage
            apps/electron/dist/*.deb
            apps/electron/dist/latest*.yml
          if-no-files-found: error

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@freestyle-voice/server
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Import Windows code signing certificate
        if: needs.validate.outputs.windows_signing == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\updated.pfx", $bytes)
          echo "WIN_CSC_LINK=$env:RUNNER_TEMP\updated.pfx" >> $env:GITHUB_ENV
          echo "CSC_LINK=$env:RUNNER_TEMP\updated.pfx" >> $env:GITHUB_ENV
          echo "CSC_KEY_PASSWORD=${{ secrets.WINDOWS_CERT_PASSWORD }}" >> $env:GITHUB_ENV
      - name: Build Windows installers
        working-directory: apps/electron
        run: pnpm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.validate.outputs.windows_signing == 'true' && 'true' || 'false' }}
      - name: Verify packaged native binaries
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: updated-windows-${{ needs.validate.outputs.version }}
          path: |
            apps/electron/dist/*.exe
            apps/electron/dist/*.msi
            apps/electron/dist/latest*.yml
            apps/electron/dist/*.blockmap
          if-no-files-found: error

  build-macos:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@freestyle-voice/server
      - name: Import macOS code signing certificate
        if: needs.validate.outputs.macos_signing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.APPLE_CERT_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/updated.p12"
          echo "CSC_LINK=$RUNNER_TEMP/updated.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.APPLE_CERT_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build macOS installers
        working-directory: apps/electron
        run: |
          pnpm run compile:native
          pnpm exec electron-vite build
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            pnpm exec electron-builder --mac --publish never -c.mac.notarize=true
          else
            pnpm exec electron-builder --mac --publish never
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.validate.outputs.macos_signing == 'true' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify packaged native binaries
        working-directory: apps/electron
        run: node scripts/verify-native-binaries.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: updated-macos-${{ needs.validate.outputs.version }}
          path: |
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/latest*.yml
            apps/electron/dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: [validate, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: UPDATED ${{ needs.validate.outputs.version }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## UPDATED beta ${{ needs.validate.outputs.version }}

            UPDATED is a voice-first desktop search instrument by AGICY.Ai.

            1. Download the installer for Windows, macOS, or Linux.
            2. Sign in with your AGICY account for hosted voice transcription.
            3. Hold the platform hotkey and speak.

            ### Code signing

            When repository secrets `WINDOWS_CERT_BASE64`, `APPLE_CERT_BASE64`, and related passwords are configured, CI produces signed Windows and notarized macOS builds. Otherwise installers are unsigned — Windows SmartScreen and macOS Gatekeeper may warn on first launch.

            Only download installers from this GitHub release or [agicy.ai/updated](https://agicy.ai/updated).
          files: release-assets/*
          fail_on_unmatched_files: true
