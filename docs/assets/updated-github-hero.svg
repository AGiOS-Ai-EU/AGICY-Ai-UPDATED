<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">UPDATED</title>
  <desc id="desc">Voice-driven search. Certificate-grade sources.</desc>
  <rect width="1280" height="640" fill="#F7F8F6"/>
  <!-- faint calibration grid -->
  <g stroke="#D6DBD7" stroke-width="0.5" opacity="0.55">
    <line x1="64" y1="0" x2="64" y2="640"/>
    <line x1="1216" y1="0" x2="1216" y2="640"/>
    <line x1="0" y1="48" x2="1280" y2="48"/>
    <line x1="0" y1="592" x2="1280" y2="592"/>
  </g>
  <!-- registration marks -->
  <g stroke="#5C6663" stroke-width="1" fill="none">
    <path d="M40 40 h16 M40 40 v16"/>
    <path d="M1240 40 h-16 M1240 40 v16"/>
    <path d="M40 600 h16 M40 600 v-16"/>
    <path d="M1240 600 h-16 M1240 600 v-16"/>
  </g>
  <!-- brand -->
  <text x="640" y="268" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="96" font-weight="500" fill="#16211F" letter-spacing="2">UPDATED</text>
  <text x="640" y="318" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5C6663">Voice-driven search. Certificate-grade sources.</text>
  <!-- claim card motif -->
  <g transform="translate(430 360)">
    <rect x="0" y="0" width="420" height="120" rx="2" ry="2" fill="#FFFFFF" stroke="#D6DBD7" stroke-width="0.5"/>
    <text x="20" y="28" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="600" fill="#5C6663" letter-spacing="1.5">PRIMARY</text>
    <text x="20" y="58" font-family="Georgia, serif" font-size="18" fill="#16211F">Primary-source rate: 1 / 4</text>
    <line x1="20" y1="74" x2="400" y2="74" stroke="#D6DBD7" stroke-width="0.5"/>
    <text x="20" y="98" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#5C6663">gov.cy · 2023-11-04 · contested check</text>
  </g>
  <!-- pill silhouette -->
  <rect x="565" y="520" width="150" height="28" rx="14" ry="14" fill="none" stroke="#D6DBD7" stroke-width="1"/>
  <circle cx="585" cy="534" r="6" fill="#16211F"/>
</svg>
